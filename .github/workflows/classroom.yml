name: Classroom Tests

on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GITHUB_REPOSITORY_OWNER: ${{ github.repository_owner }}
      GITHUB_REPOSITORY: ${{ github.repository }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Miniconda
        uses: conda-incubator/setup-miniconda@v2
        with:
          auto-update-conda: true
          python-version: 3.8
          miniconda-version: "latest"
          activate-environment: testenv
          environment-file: environment.yml

      - name: Install test dependencies
        shell: bash -l {0}
        run: |
          conda install -y pytest pytest-json-report pytest-html pandas matplotlib openpyxl

      - name: Run pytest with HTML report
        shell: bash -l {0}
        run: |
          pytest --html=report.html

      - name: Run unit tests
        shell: bash -l {0}
        run: |
          python -m unittest discover -s test
          python test/check_required_files.py
          python test/check_line_contributions.py

      - name: Upload HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Report
          path: |
            report.html
            informe_contribucio_stacked.png
            informe_contribucio_total.png
